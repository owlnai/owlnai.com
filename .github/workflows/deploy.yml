name: Deploy to Cloudflare Pages
on: push

# The site is the Cloudflare Pages project "owlnai-com". NuxtHub's deploy service no longer
# returns a project, so this deploys the build straight to Pages with Wrangler instead.
# Needs the CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID repository secrets.
jobs:
  deploy:
    name: "Deploy to Cloudflare Pages"
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # @nuxthub/core sets the cloudflare_pages preset, so the output lands in dist/
      - name: Build application
        run: pnpm build

      # Pages treats its production branch (main) as production and every other branch as a preview
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=owlnai-com --branch=${{ github.ref_name }}
